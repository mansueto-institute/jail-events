[project]
name = "jail-events"
version = "0.1.0"
description = "Extraction of Illinois Jail Event reports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.3",
    "opencv-python>=4.11.0.86",
    "pdf2image>=1.17.0",
    "pillow>=11.2.1",
    "pymupdf>=1.26.0",
    "pypdf2>=3.0.1",
    "pytesseract>=0.3.13",
    "tqdm>=4.67.1",
    "pathlib>=1.0.1",
    "polars>=1.31.0",
    "altair>=5.5.0",
    "pandas>=2.3.0",
    "pyarrow>=20.0.0",
    "jellyfish>=1.2.0",
    "fastexcel>=0.14.0",
    "vegafusion>=2.0.2",
    "vl-convert-python>=1.8.0",
    "tabulate>=0.9.0",
    "xlsxwriter>=3.2.5",
    "layoutparser[detectron2]>=0.3.4",
    "quarto-cli>=1.7.32",
    "nltk>=3.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
